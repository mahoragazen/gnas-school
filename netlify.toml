# Netlify Configuration for Mahoraga ZEN

[build]
  publish = "."
  command = "mkdir -p playground && cp -r playground-web/* playground/"

# PANTHEON playground SPA fallback
[[redirects]]
  from = "/playground/*"
  to = "/playground/index.html"
  status = 200

# Root site SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache settings
[cache]
  skip = false

# Headers
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "max-age=3600"

[[headers]]
  for = "/*.{js,css,png,jpg,jpeg,gif,svg,woff,woff2}"
  [headers.values]
    Cache-Control = "max-age=31536000, immutable"
