<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌳 Business Playground — Eden Pantheon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Sarabun:wght@400;600;800&family=VT323&family=Noto+Serif+JP:wght@700;900&family=Cinzel:wght@600;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- ===== TOP BAR ===== -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">⛩</span>
      <div class="brand-text">
        <h1>Business Playground</h1>
        <p>สวนอีเดน · 10 เทพปกรณัม · โรมัน × ญี่ปุ่น × จีน</p>
      </div>
    </div>
    <div class="stats">
      <div class="stat">
        <span class="stat-label">รายได้วันนี้</span>
        <span class="stat-value" id="todayRevenue">฿42,580</span>
      </div>
      <div class="stat">
        <span class="stat-label">งานคิว</span>
        <span class="stat-value neon-teal" id="queueCount">7</span>
      </div>
      <div class="stat">
        <span class="stat-label">เวลา</span>
        <span class="stat-value" id="clock">--:--</span>
      </div>
      <div class="phase" id="phaseIndicator">
        <span class="phase-icon">☀</span><span class="phase-text">Day</span>
      </div>
    </div>
  </header>

  <!-- ===== EDEN GARDEN ===== -->
  <main class="garden" aria-label="Eden Garden">
    <!-- Background SVG layers -->
    <svg class="garden-bg" viewBox="0 0 1400 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <!-- Sky gradient -->
        <linearGradient id="skyGrad" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%" stop-color="#f4ecd8"/>
          <stop offset="40%" stop-color="#ead8b6"/>
          <stop offset="100%" stop-color="#d8c498"/>
        </linearGradient>
        <!-- Ground gradient -->
        <linearGradient id="groundGrad" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%" stop-color="#a8a06a" stop-opacity="0.6"/>
          <stop offset="100%" stop-color="#7a7050" stop-opacity="0.85"/>
        </linearGradient>
        <!-- Water gradient -->
        <radialGradient id="pondGrad" cx="50%" cy="50%" r="60%">
          <stop offset="0%" stop-color="#5ee3d8" stop-opacity="0.4"/>
          <stop offset="80%" stop-color="#3a8b85" stop-opacity="0.5"/>
        </radialGradient>
        <filter id="inkBlur"><feGaussianBlur stdDeviation="4"/></filter>
        <filter id="softBlur"><feGaussianBlur stdDeviation="8"/></filter>
        <!-- Cherry blossom petal -->
        <symbol id="petal" viewBox="0 0 8 8">
          <path d="M4,1 Q6,2 6,4 Q6,6 4,7 Q2,6 2,4 Q2,2 4,1 Z" fill="#ff9ec7" opacity="0.85"/>
        </symbol>
        <!-- Stone (mossy) -->
        <symbol id="stone" viewBox="0 0 24 16">
          <ellipse cx="12" cy="10" rx="11" ry="5" fill="#6b6357"/>
          <ellipse cx="12" cy="9" rx="11" ry="5" fill="#8a7e72"/>
          <ellipse cx="9" cy="7" rx="4" ry="2" fill="#a8987c"/>
          <circle cx="14" cy="11" r="1" fill="#6dd66b"/>
          <circle cx="6" cy="11" r="0.8" fill="#6dd66b"/>
        </symbol>
        <!-- Sakura tree branch -->
        <symbol id="sakuraBranch" viewBox="0 0 200 120">
          <path d="M0,60 Q40,40 80,55 Q120,30 160,45 Q180,40 200,30" stroke="#5c4030" stroke-width="3" fill="none"/>
          <path d="M40,55 Q50,40 60,30" stroke="#5c4030" stroke-width="2" fill="none"/>
          <path d="M100,45 Q110,30 120,15" stroke="#5c4030" stroke-width="2" fill="none"/>
          <path d="M160,40 Q170,25 180,10" stroke="#5c4030" stroke-width="2" fill="none"/>
          <circle cx="60" cy="30" r="8" fill="#ff9ec7" opacity="0.8"/>
          <circle cx="65" cy="25" r="6" fill="#ffb8d6" opacity="0.7"/>
          <circle cx="120" cy="15" r="9" fill="#ff9ec7" opacity="0.8"/>
          <circle cx="125" cy="20" r="6" fill="#ffb8d6" opacity="0.7"/>
          <circle cx="180" cy="10" r="8" fill="#ff9ec7" opacity="0.8"/>
          <circle cx="40" cy="55" r="7" fill="#ff9ec7" opacity="0.7"/>
          <circle cx="100" cy="45" r="8" fill="#ff9ec7" opacity="0.7"/>
          <circle cx="160" cy="45" r="6" fill="#ffb8d6" opacity="0.6"/>
        </symbol>
      </defs>

      <!-- Sky -->
      <rect width="1400" height="500" fill="url(#skyGrad)"/>

      <!-- Distant mountains -->
      <path d="M0,300 L150,200 L280,260 L420,180 L560,250 L720,170 L880,230 L1040,150 L1200,220 L1400,180 L1400,500 L0,500 Z"
            fill="#5c5048" opacity="0.18" filter="url(#inkBlur)"/>
      <path d="M0,340 L180,260 L320,300 L470,220 L620,290 L780,210 L940,280 L1100,200 L1260,260 L1400,240 L1400,500 L0,500 Z"
            fill="#3d342c" opacity="0.22"/>

      <!-- Mist over mountains -->
      <ellipse cx="200" cy="320" rx="200" ry="30" fill="#f4ecd8" opacity="0.6" filter="url(#softBlur)"/>
      <ellipse cx="700" cy="280" rx="240" ry="25" fill="#f4ecd8" opacity="0.5" filter="url(#softBlur)"/>
      <ellipse cx="1100" cy="310" rx="200" ry="28" fill="#f4ecd8" opacity="0.6" filter="url(#softBlur)"/>

      <!-- Garden ground curve -->
      <path d="M0,440 Q200,420 400,440 Q700,460 1000,430 Q1200,420 1400,440 L1400,900 L0,900 Z"
            fill="url(#groundGrad)"/>

      <!-- Distant temple silhouette -->
      <g opacity="0.4">
        <rect x="640" y="350" width="120" height="60" fill="#3d342c"/>
        <polygon points="630,360 700,300 770,360" fill="#3d342c"/>
        <polygon points="640,330 700,290 760,330" fill="#3d342c"/>
        <rect x="690" y="370" width="20" height="40" fill="#1a1a1a"/>
      </g>

      <!-- Sakura branches top -->
      <g transform="translate(0, 0)">
        <use href="#sakuraBranch" x="-20" y="40" width="280" height="160"/>
      </g>
      <g transform="translate(1180, 20) scale(-1, 1)">
        <use href="#sakuraBranch" x="0" y="0" width="280" height="160"/>
      </g>

      <!-- Big koi pond center bottom -->
      <ellipse cx="700" cy="780" rx="380" ry="80" fill="url(#pondGrad)" stroke="#5c5048" stroke-width="3"/>
      <ellipse cx="700" cy="775" rx="370" ry="74" fill="none" stroke="#fff" stroke-width="1" opacity="0.4"/>

      <!-- Koi fish in pond -->
      <g transform="translate(620, 770)">
        <ellipse cx="0" cy="0" rx="18" ry="6" fill="#ff7a4a"/>
        <ellipse cx="-18" cy="0" rx="6" ry="4" fill="#ff7a4a"/>
        <circle cx="6" cy="-1" r="1" fill="#2a2520"/>
        <ellipse cx="0" cy="0" rx="18" ry="6" fill="none" stroke="#fff" stroke-width="1" opacity="0.6"/>
      </g>
      <g transform="translate(780, 790)">
        <ellipse cx="0" cy="0" rx="14" ry="5" fill="#fff"/>
        <ellipse cx="-14" cy="0" rx="5" ry="3" fill="#fff"/>
        <circle cx="4" cy="-1" r="0.8" fill="#2a2520"/>
        <ellipse cx="-2" cy="-2" rx="3" ry="2" fill="#ff7a4a"/>
      </g>

      <!-- Stone bridge over pond -->
      <g transform="translate(700, 740)">
        <path d="M-80,0 Q0,-20 80,0 L80,15 Q0,-5 -80,15 Z" fill="#8a7e72" stroke="#5c5048" stroke-width="2"/>
        <line x1="-60" y1="-3" x2="-60" y2="8" stroke="#5c5048" stroke-width="1.5"/>
        <line x1="-30" y1="-12" x2="-30" y2="-1" stroke="#5c5048" stroke-width="1.5"/>
        <line x1="0" y1="-18" x2="0" y2="-3" stroke="#5c5048" stroke-width="1.5"/>
        <line x1="30" y1="-12" x2="30" y2="-1" stroke="#5c5048" stroke-width="1.5"/>
        <line x1="60" y1="-3" x2="60" y2="8" stroke="#5c5048" stroke-width="1.5"/>
      </g>

      <!-- Stones scattered -->
      <use href="#stone" x="100" y="500" width="48" height="32"/>
      <use href="#stone" x="240" y="540" width="36" height="24"/>
      <use href="#stone" x="1180" y="520" width="48" height="32"/>
      <use href="#stone" x="1280" y="560" width="32" height="22"/>
      <use href="#stone" x="50" y="700" width="40" height="28"/>
      <use href="#stone" x="1310" y="700" width="44" height="30"/>
      <use href="#stone" x="320" y="690" width="32" height="22"/>
      <use href="#stone" x="1080" y="690" width="32" height="22"/>

      <!-- Bamboo cluster left -->
      <g opacity="0.6" transform="translate(20, 380)">
        <rect x="0" y="0" width="6" height="380" fill="#3d342c"/>
        <rect x="-6" y="60" width="18" height="3" fill="#3d342c"/>
        <rect x="-6" y="160" width="18" height="3" fill="#3d342c"/>
        <rect x="-6" y="260" width="18" height="3" fill="#3d342c"/>
        <path d="M6,30 Q40,20 60,0 L60,8 Q40,28 6,38 Z" fill="#3d342c"/>
        <path d="M6,180 Q40,170 64,150 L64,158 Q40,178 6,188 Z" fill="#3d342c"/>
        <rect x="30" y="0" width="4" height="380" fill="#3d342c" opacity="0.7"/>
        <rect x="24" y="120" width="14" height="3" fill="#3d342c"/>
        <rect x="24" y="220" width="14" height="3" fill="#3d342c"/>
        <rect x="24" y="320" width="14" height="3" fill="#3d342c"/>
      </g>
      <!-- Bamboo cluster right -->
      <g opacity="0.55" transform="translate(1340, 380) scale(-1, 1)">
        <rect x="0" y="0" width="6" height="380" fill="#3d342c"/>
        <rect x="-6" y="80" width="18" height="3" fill="#3d342c"/>
        <rect x="-6" y="200" width="18" height="3" fill="#3d342c"/>
        <rect x="-6" y="300" width="18" height="3" fill="#3d342c"/>
        <path d="M6,40 Q40,30 60,10 L60,18 Q40,38 6,48 Z" fill="#3d342c"/>
        <path d="M6,200 Q40,190 64,170 L64,178 Q40,198 6,208 Z" fill="#3d342c"/>
        <rect x="30" y="0" width="4" height="380" fill="#3d342c" opacity="0.7"/>
      </g>

      <!-- Lanterns hanging from sakura -->
      <g transform="translate(170, 200)">
        <line x1="0" y1="0" x2="0" y2="30" stroke="#3d342c" stroke-width="1.5"/>
        <ellipse cx="0" cy="40" rx="14" ry="18" fill="#ff7eb6" opacity="0.85" stroke="#3d342c" stroke-width="2"/>
        <line x1="-14" y1="40" x2="14" y2="40" stroke="#3d342c" stroke-width="1"/>
      </g>
      <g transform="translate(1180, 220)">
        <line x1="0" y1="0" x2="0" y2="30" stroke="#3d342c" stroke-width="1.5"/>
        <ellipse cx="0" cy="40" rx="14" ry="18" fill="#ffb84d" opacity="0.85" stroke="#3d342c" stroke-width="2"/>
        <line x1="-14" y1="40" x2="14" y2="40" stroke="#3d342c" stroke-width="1"/>
      </g>

      <!-- Falling petals (animated via CSS) -->
      <g class="petals">
        <use href="#petal" x="200" y="100" width="14" height="14" class="petal p1"/>
        <use href="#petal" x="500" y="60" width="10" height="10" class="petal p2"/>
        <use href="#petal" x="800" y="80" width="12" height="12" class="petal p3"/>
        <use href="#petal" x="1100" y="120" width="14" height="14" class="petal p4"/>
        <use href="#petal" x="350" y="200" width="10" height="10" class="petal p5"/>
        <use href="#petal" x="950" y="220" width="12" height="12" class="petal p6"/>
      </g>

      <!-- Sun behind clouds -->
      <circle cx="1100" cy="120" r="55" fill="#ffb84d" opacity="0.55" filter="url(#softBlur)"/>
      <circle cx="1100" cy="120" r="42" fill="#ffd87a" opacity="0.6"/>
    </svg>

    <!-- ===== TORII GATE + MERCURY (Orchestrator at center top) ===== -->
    <div class="torii-altar">
      <svg class="torii-svg" viewBox="0 0 440 360" aria-hidden="true">
        <defs>
          <linearGradient id="toriiG" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0%" stop-color="#c14d3a"/>
            <stop offset="100%" stop-color="#7a2a1f"/>
          </linearGradient>
        </defs>
        <!-- top kasagi curve -->
        <path d="M20,60 Q220,20 420,60 L440,90 Q220,40 0,90 Z" fill="url(#toriiG)"/>
        <!-- nuki crossbeam -->
        <rect x="40" y="110" width="360" height="24" fill="url(#toriiG)"/>
        <!-- pillars -->
        <rect x="76" y="84" width="38" height="260" fill="url(#toriiG)"/>
        <rect x="326" y="84" width="38" height="260" fill="url(#toriiG)"/>
        <!-- plaque -->
        <rect x="200" y="84" width="40" height="36" fill="#2a2520"/>
        <text x="220" y="110" text-anchor="middle" font-family="Noto Serif JP, serif" font-size="22" fill="#d4af37" font-weight="900">神</text>
        <!-- pillar bases -->
        <rect x="64" y="334" width="64" height="14" fill="#2a2520"/>
        <rect x="312" y="334" width="64" height="14" fill="#2a2520"/>
      </svg>
      <button class="deity mercury" data-deity="mercury" aria-label="Mercury — Orchestrator">
        <div class="deity-glow"></div>
        <!-- HIGH DETAIL Mercury character SVG -->
        <svg viewBox="0 0 128 160" class="char-svg" shape-rendering="crispEdges">
          <!-- Halo glow ring -->
          <circle cx="64" cy="34" r="36" fill="none" stroke="#ffb84d" stroke-width="1.5" opacity="0.5"/>
          <circle cx="64" cy="34" r="28" fill="none" stroke="#ffb84d" stroke-width="1" opacity="0.7"/>

          <!-- Winged helmet (petasos) -->
          <rect x="42" y="22" width="44" height="4" fill="#d4af37"/>
          <rect x="38" y="26" width="52" height="3" fill="#b8932e"/>
          <rect x="46" y="20" width="36" height="2" fill="#e8c54a"/>
          <!-- Helmet wings left -->
          <rect x="30" y="22" width="3" height="8" fill="#fff"/>
          <rect x="27" y="24" width="3" height="6" fill="#fff"/>
          <rect x="24" y="26" width="3" height="4" fill="#fff"/>
          <rect x="21" y="28" width="3" height="2" fill="#e8e8e8"/>
          <!-- Helmet wings right -->
          <rect x="95" y="22" width="3" height="8" fill="#fff"/>
          <rect x="98" y="24" width="3" height="6" fill="#fff"/>
          <rect x="101" y="26" width="3" height="4" fill="#fff"/>
          <rect x="104" y="28" width="3" height="2" fill="#e8e8e8"/>

          <!-- Face shadow row -->
          <rect x="42" y="30" width="44" height="2" fill="#3d342c"/>
          <!-- Face -->
          <rect x="42" y="32" width="44" height="22" fill="#e8c79a"/>
          <rect x="40" y="34" width="2" height="20" fill="#d4a87a"/>
          <rect x="86" y="34" width="2" height="20" fill="#d4a87a"/>
          <!-- Eyes -->
          <rect x="50" y="40" width="4" height="4" fill="#fff"/>
          <rect x="52" y="42" width="2" height="2" fill="#2a5b7a"/>
          <rect x="74" y="40" width="4" height="4" fill="#fff"/>
          <rect x="76" y="42" width="2" height="2" fill="#2a5b7a"/>
          <!-- Eyebrows -->
          <rect x="48" y="38" width="6" height="1" fill="#3d342c"/>
          <rect x="74" y="38" width="6" height="1" fill="#3d342c"/>
          <!-- Mouth -->
          <rect x="58" y="48" width="12" height="1" fill="#a13d2d"/>
          <rect x="60" y="49" width="8" height="1" fill="#7a2a1f"/>
          <!-- Cheek blush -->
          <rect x="46" y="46" width="3" height="2" fill="#ff9ec7" opacity="0.5"/>
          <rect x="79" y="46" width="3" height="2" fill="#ff9ec7" opacity="0.5"/>
          <!-- Chin shadow -->
          <rect x="42" y="54" width="44" height="2" fill="#3d342c"/>

          <!-- Neck -->
          <rect x="56" y="56" width="16" height="6" fill="#e8c79a"/>

          <!-- Tunic / chiton (Roman) -->
          <rect x="36" y="62" width="56" height="44" fill="#d4af37"/>
          <rect x="38" y="64" width="52" height="40" fill="#c69a26"/>
          <!-- Highlight -->
          <rect x="40" y="64" width="20" height="2" fill="#e8c54a"/>
          <!-- Belt -->
          <rect x="36" y="96" width="56" height="5" fill="#7a2a1f"/>
          <rect x="60" y="96" width="8" height="5" fill="#d4af37"/>
          <!-- Tunic folds -->
          <rect x="46" y="68" width="2" height="28" fill="#a8801f" opacity="0.7"/>
          <rect x="80" y="68" width="2" height="28" fill="#a8801f" opacity="0.7"/>
          <rect x="62" y="72" width="3" height="24" fill="#a8801f" opacity="0.5"/>

          <!-- Arms -->
          <rect x="28" y="64" width="8" height="22" fill="#e8c79a"/>
          <rect x="26" y="66" width="2" height="20" fill="#d4a87a"/>
          <rect x="92" y="64" width="8" height="22" fill="#e8c79a"/>
          <rect x="100" y="66" width="2" height="20" fill="#d4a87a"/>
          <!-- Forearms (Mercury holding caduceus + bag) -->
          <rect x="30" y="86" width="6" height="18" fill="#e8c79a"/>
          <rect x="92" y="86" width="6" height="18" fill="#e8c79a"/>

          <!-- Caduceus staff (left hand) -->
          <rect x="30" y="50" width="2" height="56" fill="#d4af37"/>
          <rect x="28" y="48" width="6" height="3" fill="#d4af37"/>
          <!-- Caduceus wings -->
          <rect x="22" y="52" width="3" height="4" fill="#fff"/>
          <rect x="20" y="54" width="2" height="2" fill="#fff"/>
          <rect x="37" y="52" width="3" height="4" fill="#fff"/>
          <rect x="40" y="54" width="2" height="2" fill="#fff"/>
          <!-- Serpents winding -->
          <path d="M30,60 Q34,64 30,68 Q26,72 30,76 Q34,80 30,84" stroke="#3d342c" stroke-width="1" fill="none"/>
          <path d="M32,60 Q28,64 32,68 Q36,72 32,76 Q28,80 32,84" stroke="#5c5048" stroke-width="1" fill="none"/>

          <!-- Money pouch (right hand) -->
          <rect x="96" y="100" width="14" height="12" fill="#8b6240"/>
          <rect x="94" y="98" width="18" height="3" fill="#5c4030"/>
          <text x="103" y="111" text-anchor="middle" font-size="6" fill="#d4af37" font-weight="900">$</text>

          <!-- Big wings on back -->
          <g opacity="0.9">
            <path d="M28,72 Q12,68 6,80 Q4,84 12,82 Q22,82 28,80 Z" fill="#fff" stroke="#3d342c" stroke-width="0.8"/>
            <path d="M28,78 Q10,78 4,90 Q4,94 12,90 Q22,88 28,86 Z" fill="#fff" stroke="#3d342c" stroke-width="0.8"/>
            <path d="M100,72 Q116,68 122,80 Q124,84 116,82 Q106,82 100,80 Z" fill="#fff" stroke="#3d342c" stroke-width="0.8"/>
            <path d="M100,78 Q118,78 124,90 Q124,94 116,90 Q106,88 100,86 Z" fill="#fff" stroke="#3d342c" stroke-width="0.8"/>
            <!-- Feather details -->
            <line x1="14" y1="80" x2="20" y2="78" stroke="#3d342c" stroke-width="0.4"/>
            <line x1="14" y1="84" x2="20" y2="82" stroke="#3d342c" stroke-width="0.4"/>
            <line x1="114" y1="80" x2="108" y2="78" stroke="#3d342c" stroke-width="0.4"/>
            <line x1="114" y1="84" x2="108" y2="82" stroke="#3d342c" stroke-width="0.4"/>
          </g>

          <!-- Legs -->
          <rect x="46" y="106" width="14" height="32" fill="#e8c79a"/>
          <rect x="68" y="106" width="14" height="32" fill="#e8c79a"/>
          <rect x="44" y="108" width="2" height="28" fill="#d4a87a"/>
          <rect x="80" y="108" width="2" height="28" fill="#d4a87a"/>
          <!-- Winged sandals -->
          <rect x="42" y="136" width="20" height="6" fill="#8b6240"/>
          <rect x="66" y="136" width="20" height="6" fill="#8b6240"/>
          <rect x="38" y="134" width="4" height="3" fill="#fff"/>
          <rect x="36" y="136" width="2" height="2" fill="#fff"/>
          <rect x="86" y="134" width="4" height="3" fill="#fff"/>
          <rect x="90" y="136" width="2" height="2" fill="#fff"/>
        </svg>
        <div class="deity-label">
          <span class="thai">เมอร์คิวรี</span>
          <span class="en">MERCURY ⚡</span>
          <span class="role">ORCHESTRATOR</span>
        </div>
      </button>
    </div>

    <!-- ===== 9 DEITIES IN GARDEN ===== -->

    <!-- UZUME (Japanese) - TikTok Live - left of pond -->
    <button class="deity uzume" data-deity="uzume" aria-label="Uzume — TikTok Live" style="--x: 12%; --y: 50%; --accent: #ff7eb6;">
      <div class="deity-glow"></div>
      <svg viewBox="0 0 128 160" class="char-svg" shape-rendering="crispEdges">
        <circle cx="64" cy="34" r="28" fill="none" stroke="#ff7eb6" stroke-width="1.2" opacity="0.6"/>
        <!-- Hair ornament -->
        <rect x="56" y="14" width="16" height="2" fill="#a13d2d"/>
        <rect x="60" y="10" width="8" height="4" fill="#ff7eb6"/>
        <!-- Hair top -->
        <rect x="40" y="16" width="48" height="8" fill="#2a2520"/>
        <rect x="38" y="20" width="52" height="6" fill="#2a2520"/>
        <!-- Face -->
        <rect x="42" y="26" width="44" height="22" fill="#f0d2a0"/>
        <rect x="40" y="28" width="2" height="18" fill="#d8b888"/>
        <rect x="86" y="28" width="2" height="18" fill="#d8b888"/>
        <!-- Eyes (smiling/closed for joy) -->
        <path d="M48,38 Q52,34 56,38" stroke="#2a2520" stroke-width="1.5" fill="none"/>

        <circle cx="20" cy="98" r="1" fill="#fff"/>
        <!-- Bamboo flute/staff (right) -->
        <rect x="108" y="40" width="3" height="64" fill="#8b6240"/>
        <rect x="107" y="40" width="5" height="2" fill="#d4af37"/>
        <rect x="107" y="50" width="5" height="1" fill="#3d342c"/>
        <rect x="107" y="60" width="5" height="1" fill="#3d342c"/>
        <rect x="107" y="70" width="5" height="1" fill="#3d342c"/>
        <rect x="107" y="80" width="5" height="1" fill="#3d342c"/>
        <!-- Small cow companion -->
        <g transform="translate(96, 130)">
          <ellipse cx="0" cy="0" rx="14" ry="8" fill="#fff" stroke="#3d342c" stroke-width="1"/>
          <ellipse cx="0" cy="0" rx="14" ry="8" fill="none" stroke="#3d342c" stroke-width="0.8"/>
          <ellipse cx="-6" cy="-3" rx="3" ry="2" fill="#3d342c"/>
          <ellipse cx="6" cy="-3" rx="3" ry="2" fill="#3d342c"/>
          <rect x="-2" y="-8" width="4" height="3" fill="#fff" stroke="#3d342c" stroke-width="0.5"/>
          <circle cx="-3" cy="-8" r="0.8" fill="#3d342c"/>
          <circle cx="3" cy="-8" r="0.8" fill="#3d342c"/>
          <!-- Cow legs -->
          <rect x="-12" y="6" width="3" height="6" fill="#3d342c"/>
          <rect x="-4" y="6" width="3" height="6" fill="#3d342c"/>
          <rect x="2" y="6" width="3" height="6" fill="#3d342c"/>
          <rect x="10" y="6" width="3" height="6" fill="#3d342c"/>
        </g>
        <!-- Legs -->
        <rect x="40" y="104" width="20" height="34" fill="#5a8db8"/>
        <rect x="68" y="104" width="20" height="34" fill="#5a8db8"/>
        <!-- Boots -->
        <rect x="38" y="138" width="24" height="8" fill="#5c4030"/>
        <rect x="66" y="138" width="24" height="8" fill="#5c4030"/>
      </svg>
      <div class="deity-label">
        <span class="thai">หนิวหวัง</span>
        <span class="en">NIU WANG 牛王</span>
        <span class="role">NORTH14 · CN</span>
      </div>
    </button>
  </main>

  <!-- ===== ACTIVITY LOG DRAWER ===== -->
  <button class="log-toggle" id="logToggle" aria-label="Toggle log">
    <span class="log-toggle-icon">📜</span>
    <span class="log-toggle-text">Activity Log</span>
    <span class="live-pulse"></span>
  </button>

  <aside class="logbook" id="logbook">
    <div class="logbook-header">
      <span class="scroll-icon">📜</span>
      <h2>Activity Log · Live</h2>
      <span class="live-pulse"></span>
      <button class="log-close" id="logClose">✕</button>
    </div>
    <div class="logbook-feed" id="logFeed">
      <!-- entries populated by JS -->
    </div>
  </aside>

  <!-- ===== MODAL ===== -->
  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal-card">
      <button class="modal-close" id="modalClose" aria-label="ปิด">✕</button>
      <div class="modal-header">
        <div class="modal-avatar" id="modalAvatar"></div>
        <div>
          <h2 id="modalName">เทพ</h2>
          <p id="modalRole">บทบาท</p>
        </div>
      </div>
      <div class="modal-body">
        <p class="modal-desc" id="modalDesc">รายละเอียดเทพ</p>
        <div class="modal-stats" id="modalStats"></div>
        <h3 class="modal-section">งานวันนี้</h3>
        <ul class="task-list" id="modalTasks"></ul>
        <div class="modal-cmd">
          <input type="text" placeholder="สั่งงานเทพองค์นี้ (เช่น 'เขียน carousel หัวข้อพระอาทิตย์')" id="modalInput">
          <button class="cmd-btn" id="modalSend">ส่งคำสั่ง ✨</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
